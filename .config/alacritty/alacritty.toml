[env]
TERM = "xterm-256color"

[window]
padding = { x=4, y=4 }
dimensions = { columns=120, lines=40 }

[terminal.shell]
program = "tmux"
args = ["new-session", "-ADs", "main"]

[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font Mono"
style="Regular"

[general]
import = [
	"~/.config/alacritty/nord.toml"
]

[keyboard]
bindings = [ { key = "Return", mods = "Shift", chars = "\n" } ] 
